site_name: periodontal-modeling
theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

site_author: Tobias Brock

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            render_typehint_in_signature: true
          selection:
            strict: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true

